name: Release

# Publishing channel: GitHub Releases. The workflow verifies the tag against the
# package version, builds the sdist and wheel, smoke-tests the wheel outside the
# repository, and attaches both artifacts with CHANGELOG.md as the notes.
#
# PyPI is not configured for this repository. Publishing there needs either a
# PYPI_API_TOKEN secret (twine) or trusted publishing (`environment: pypi` plus
# `permissions: id-token: write`, no secret). Neither exists yet, so no upload
# step is wired. See docs/RELEASE-POLICY.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tags must start with v"; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "releasing $tag"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          tag="${RELEASE_TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $RELEASE_TAG does not match the package version $version"
            exit 1
          fi
          echo "tag $RELEASE_TAG matches package version $version"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the distributions
        run: twine check --strict dist/*

      - name: Smoke-test the wheel outside the repository
        env:
          UDOS_HOME: ${{ runner.temp }}/udos
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          venv="$RUNNER_TEMP/wheel-smoke/bin"
          "$venv/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$venv/uhome" --version)" = "${RELEASE_TAG#v}"
          "$venv/python" -c "import uhome_server; print('installed version', uhome_server.__version__)"
          "$venv/python" - <<'PY'
          from fastapi.testclient import TestClient

          from uhome_server.app import create_app

          client = TestClient(create_app())
          response = client.get("/api/runtime/thin/home/index")
          assert response.status_code == 200, f"thin home returned {response.status_code}"
          print("thin home", response.status_code, len(response.text), "bytes")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HomeNook ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
