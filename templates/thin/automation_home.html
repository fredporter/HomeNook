<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-user-select: none; user-select: none; overscroll-behavior: contain; }
        .touch-target { min-height: 3rem; min-width: 3rem; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="container mx-auto px-6 py-8">
        <h1 class="mb-6 text-3xl font-bold">{{ page_title }}</h1>

        <section class="mb-8 grid grid-cols-1 gap-4 md:grid-cols-3">
            {% for room in rooms %}
            <article class="rounded-xl bg-slate-900 p-5">
                <h2 class="mb-3 text-xl font-semibold">{{ room.name }}</h2>
                <ul class="space-y-2">
                    {% for device in room.devices %}
                    <li class="flex items-center justify-between text-sm">
                        <span>{{ device.name }}</span>
                        <span class="text-slate-400">{{ device.state }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </article>
            {% endfor %}
        </section>

        <section>
            <h2 class="mb-3 text-xl font-semibold">Scenes</h2>
            <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
                {% for scene in scenes %}
                <button class="touch-target rounded-xl bg-slate-800 px-4 py-4 text-left">
                    <span class="block text-2xl">{{ scene.icon }}</span>
                    <span class="block">{{ scene.name }}</span>
                    <span class="block text-xs text-slate-400">{{ scene.devices_affected }} devices</span>
                </button>
                {% endfor %}
            </div>
        </section>

        <nav class="mt-8 text-sm text-slate-500">
            <a class="text-amber-400 hover:underline" href="/api/runtime/thin/automation">Automation</a>
            <span aria-hidden="true"> · </span>
            <a class="text-amber-400 hover:underline" href="/api/runtime/thin/home">Home</a>
        </nav>
    </main>
</body>
</html>
